; SIP du banc : un transport UDP et une seule entrée, celle du simulateur SIPp.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Le simulateur. Pas d'authentification : il est reconnu par son réseau, qui est
; le réseau interne du banc (compose.yaml), sans accès depuis l'extérieur.
[sipp]
type = endpoint
context = depuis-sipp
disallow = all
; Le canal média de Dograh est en ulaw : toute entrée qui le rejoint doit l'accepter.
allow = ulaw
direct_media = no
aors = sipp

[sipp]
type = identify
endpoint = sipp
match = 10.213.7.0/24

; Destination des appels sortants et des transferts du banc : SIPp en réception.
[sipp]
type = aor
contact = sip:sipp-recepteur:5060
