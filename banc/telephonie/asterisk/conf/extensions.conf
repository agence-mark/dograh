; Plan d'appels du banc. Aucun Answer() avant Stasis() : le fork prend un canal
; déjà décroché (état Up) pour un appel sortant et l'abandonne
; (api/services/telephony/ari_manager.py:535-566).
[general]
static = yes
writeprotect = yes

[globals]
; Nom de l'application Stasis du fork. Dograh le génère à l'enregistrement de la
; configuration ; le banc le pose ensuite par « dialplan set global APP_FORK ... ».
APP_FORK = application-non-configuree

[depuis-sipp]
; 9000 à 9999 : la sonde du banc. L'extension choisit la variante mesurée, et
; l'en-tête X-Banc-Mesure posé par SIPp donne son nom à la mesure.
exten => _9XXX,1,NoOp(Banc, sonde, variante ${EXTEN})
 same => n,Stasis(sonde,${EXTEN},${PJSIP_HEADER(read,X-Banc-Mesure)})
 same => n,Hangup()

; Tout le reste : le fork.
exten => _X.,1,NoOp(Banc, fork, extension ${EXTEN})
 same => n,Stasis(${APP_FORK})
 same => n,Hangup()
