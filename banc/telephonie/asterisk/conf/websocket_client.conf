; Connexions WebSocket sortantes d'Asterisk pour le son (chan_websocket).
; Le nom de section est le « WebSocket Client Name » saisi dans Dograh, et la
; valeur passée en external_host à externalMedia.
;
; connection_type = per_call_config : une connexion par appel, exigée par
; chan_websocket. L'exemple de docs/integrations/telephony/asterisk-ari.mdx l'omet.
;
; uri : sans paramètres. Dograh les ajoute à chaque appel par v(...) dans
; transport_data.

; Le fork : la route du flux audio de l'API.
[dograh]
type = websocket_client
connection_type = per_call_config
uri = ws://api:8000/api/v1/telephony/ws/ari
protocols = media

; La sonde du banc : le petit serveur qui mesure la commande de vidage.
[sonde]
type = websocket_client
connection_type = per_call_config
uri = ws://sonde:8090/media
protocols = media
