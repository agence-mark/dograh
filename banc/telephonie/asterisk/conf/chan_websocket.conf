; Réglage du canal WebSocket (le son entre Asterisk et Dograh).
;
; control_message_format : le format des messages de contrôle (MEDIA_START reçu,
; FLUSH_MEDIA envoyé). « plain-text » est la valeur par défaut d'Asterisk : elle
; est écrite ici pour que le banc dise sur quel réglage il mesure. Un appel peut
; demander l'autre format par f(json) dans transport_data.
[global]
control_message_format = plain-text
