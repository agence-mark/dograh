# Banc de téléphonie .mark (lots 0 et 1 du plan « téléphonie et mise en service »).
#
# Un compose À PART : il ne lit, n'étend et ne modifie aucun autre compose du
# dépôt. Son nom de projet lui donne ses propres conteneurs, volumes et réseau.
#
#   Démarrer la sonde :   ./banc.sh demarrer
#   Démarrer le fork :    ./banc.sh demarrer-fork   (API, base et Redis)
#   Tout arrêter :        ./banc.sh arreter
#
# Aucun port n'est publié sur le poste, et le réseau est interne : rien ne sort
# vers Internet pendant un essai (ni appel, ni fournisseur, ni télémesure).
name: banc-telephonie-mark

services:
  asterisk:
    # BANC_IMAGE_ASTERISK permet de rejouer le banc sur une autre version construite
    # à la main (docker build --build-arg ASTERISK_VERSION=... asterisk/).
    image: "${BANC_IMAGE_ASTERISK:-banc-telephonie-mark/asterisk:22.12.0}"
    build:
      context: ./asterisk
    environment:
      BANC_ARI_UTILISATEUR: "${BANC_ARI_UTILISATEUR:?lancer ./banc.sh preparer}"
      BANC_ARI_MOT_DE_PASSE: "${BANC_ARI_MOT_DE_PASSE:?lancer ./banc.sh preparer}"
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      banc:
        ipv4_address: 10.213.7.10

  # La sonde tient la place du fork pour mesurer la commande de vidage.
  sonde:
    image: banc-telephonie-mark/sonde:1
    build:
      context: ./sonde
    environment:
      BANC_ARI_UTILISATEUR: "${BANC_ARI_UTILISATEUR:?lancer ./banc.sh preparer}"
      BANC_ARI_MOT_DE_PASSE: "${BANC_ARI_MOT_DE_PASSE:?lancer ./banc.sh preparer}"
    volumes:
      - ./resultats:/resultats
      # Les outils du banc qui parlent à l'API du fork (compte, analyse d'un run).
      - ./fork:/banc/fork:ro
    depends_on:
      asterisk:
        condition: service_healthy
    networks:
      - banc

  # Le relais du flux audio : il se place entre Asterisk et le fork le temps d'un
  # essai (./banc.sh relais on), pour lire la file d'Asterisk pendant un appel du
  # fork réel. Hors de ces essais, Asterisk parle au fork sans lui.
  relais:
    profiles: ["fork"]
    image: banc-telephonie-mark/sonde:1
    command: ["python", "relais.py"]
    volumes:
      - ./resultats:/resultats
    networks:
      - banc

  # Le simulateur d'appels. Il attend : chaque appel part par « docker compose exec ».
  sipp:
    image: banc-telephonie-mark/sipp:1
    build:
      context: ./sipp
    volumes:
      - ./resultats:/resultats
    networks:
      - banc

  # SIPp en réception : il décroche les appels sortants et les transferts du fork
  # (pjsip.conf, contact de l'entrée « sipp »), et renvoie le son qu'il reçoit.
  # Le numéro 1001 sonne sans jamais décrocher (scenarios/recepteur.xml).
  sipp-recepteur:
    profiles: ["fork"]
    image: banc-telephonie-mark/sipp:1
    command:
      - sh
      - -c
      - >
        exec sipp -sf /banc/scenarios/recepteur.xml -p 5060 -mp 7000 -rtp_echo -nostdin
        -trace_msg -message_file /resultats/recepteur.sip.log
        > /resultats/recepteur.sipp.log 2>&1
    volumes:
      - ./resultats:/resultats
    networks:
      - banc

  # Les faux fournisseurs : transcription (protocole de Soniox), modèle (API
  # compatible OpenAI) et voix (protocole d'ElevenLabs). L'organisation du banc
  # règle l'adresse de ses trois fournisseurs sur ce service : l'agent parle
  # sans clé et sans rien envoyer hors du banc.
  faux:
    profiles: ["fork"]
    image: banc-telephonie-mark/faux:1
    build:
      context: ./faux
    volumes:
      - ./resultats:/resultats
      - certificats:/certificats
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/sante'').read()"',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      banc:
        # La vérification de clé de Soniox vise ce nom, qui ne se règle pas
        # (api/services/configuration/check_validity.py). Sur ce réseau fermé,
        # il mène ici (faux/certificat.py).
        aliases:
          - api.soniox.com

  # ----------------------------------------------------------------- le fork
  # Profil « fork » : l'API du dépôt, construite depuis api/Dockerfile, avec sa
  # base, son Redis et son stockage. Mêmes images que docker-compose.yaml.

  postgres:
    profiles: ["fork"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${BANC_POSTGRES_MOT_DE_PASSE:?lancer ./banc.sh preparer}"
      POSTGRES_DB: postgres
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - banc

  redis:
    profiles: ["fork"]
    image: redis:7
    command: ["--requirepass", "${BANC_REDIS_MOT_DE_PASSE:?lancer ./banc.sh preparer}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_MOT_DE_PASSE\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
    environment:
      REDIS_MOT_DE_PASSE: "${BANC_REDIS_MOT_DE_PASSE:?lancer ./banc.sh preparer}"
    networks:
      - banc

  # Pas de MinIO sur le banc : l'image que le dépôt référence (quay.io/minio/minio)
  # est refusée au téléchargement (401, relevé le 19/11/2026), comme minio/minio
  # sur Docker Hub. Le stockage des enregistrements est hors du sujet du banc :
  # l'API démarre sans lui (api/services/filesystem/minio.py:57-90), et l'envoi
  # des enregistrements est coupé plus bas.

  api:
    profiles: ["fork"]
    # BANC_IMAGE_API permet de jouer le banc sur une variante construite à part
    # (./banc.sh construire-sans), sans toucher à l'arbre de travail.
    image: "${BANC_IMAGE_API:-banc-telephonie-mark/api:local}"
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      ENVIRONMENT: "local"
      LOG_LEVEL: "DEBUG"
      ENABLE_SIGNUP: "true"
      # Rien ne part vers un tiers depuis le banc.
      ENABLE_TELEMETRY: "false"
      ENABLE_DOGRAH_MANAGED_PROVISIONING: "false"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "false"
      ENABLE_ARI_MANAGER: "true"
      BACKEND_API_ENDPOINT: "http://api:8000"
      DATABASE_URL: "postgresql+asyncpg://postgres:${BANC_POSTGRES_MOT_DE_PASSE:?lancer ./banc.sh preparer}@postgres:5432/postgres"
      REDIS_URL: "redis://:${BANC_REDIS_MOT_DE_PASSE:?lancer ./banc.sh preparer}@redis:6379"
      ENABLE_AWS_S3: "false"
      # Aucun stockage ne répond à cette adresse sur le banc (voir plus haut).
      MINIO_ENDPOINT: "stockage-absent:9000"
      MINIO_PUBLIC_ENDPOINT: "http://stockage-absent:9000"
      ENABLE_CALL_RECORDING_UPLOAD: "false"
      OSS_JWT_SECRET: "${BANC_JWT_SECRET:?lancer ./banc.sh preparer}"
      # Jeton du flux audio (scénario 14) : vides par défaut, comme en production.
      TELEPHONY_WS_TOKEN_SECRET: "${BANC_WS_TOKEN_SECRET:-}"
      TELEPHONY_WS_TOKEN_ENFORCE: "${BANC_WS_TOKEN_ENFORCE:-false}"
      DEFAULT_ORG_CONCURRENCY_LIMIT: "${BANC_LIMITE_APPELS:-10}"
      # La seule autorité reconnue par l'API du banc est celle du faux
      # fournisseur (faux/certificat.py). Sans effet ailleurs : le réseau est fermé.
      SSL_CERT_FILE: "/certificats-banc/autorite.pem"
    volumes:
      - certificats:/certificats-banc:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy
      faux:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - banc

  # --------------------------------------------------------------- les tests
  # Profil « essais » : pytest sur l'arbre de travail du dépôt, monté dans /app.
  # La base de tests (test_db) est créée par api/conftest.py dans le Postgres du banc.
  essais:
    profiles: ["essais"]
    image: banc-telephonie-mark/essais:local
    build:
      context: ./essais
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${BANC_POSTGRES_MOT_DE_PASSE:?lancer ./banc.sh preparer}@postgres:5432/test_db"
      REDIS_URL: "redis://:${BANC_REDIS_MOT_DE_PASSE:?lancer ./banc.sh preparer}@redis:6379/0"
    volumes:
      - "${BANC_ARBRE:-../..}:/app"
      - ../../pipecat:/app/pipecat:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banc

volumes:
  donnees_postgres:
  certificats:

networks:
  banc:
    internal: true
    ipam:
      config:
        - subnet: 10.213.7.0/24
