# [.mark] Nos contrôles de CI, regroupés dans un fichier à nous (décision D4 du
# chantier durcissement-outils-fork, 25/09/2026) : les fichiers de CI de l'amont
# gardent leur déclenchement d'origine, et une remise à niveau ne rencontre ici
# aucun conflit.
#
# Pourquoi ce fichier existe :
#   • T1 : l'écran n'était vérifié par AUCUNE machine. Un test d'écran est resté
#     rouge du 17/09 au 25/09 sans que rien ne le signale.
#   • T3/T4 : les réflexes R2 (Pipecat des deux côtés) et R3 (nom non défini)
#     ne tenaient qu'à la discipline ; la mise en forme de l'amont ne tournait
#     jamais chez nous.
#
# Bloquant = le travail passe au rouge, et la procédure du fork interdit de
# fusionner une branche dont la CI n'est pas verte. Informatif = le résultat
# s'affiche, le travail reste vert.

name: "[.mark] Garde-fous"

on:
  push:
    branches:
      - "chantier/**"
      - "mark/deploiement"
  workflow_dispatch:

# Lecture seule : ces contrôles n'écrivent jamais dans le dépôt (relecture du 25/09).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecran:
    name: Écran (typage, tests, build, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typage (bloquant)
        run: npx tsc --noEmit

      # ⛔ UN test de l'amont est exclu, par son nom exact, et c'est une décision
      # d'Evan (25/09/2026, option A, `reference/17-decisions.md`) : un réglage
      # masqué pour le modèle choisi GARDE sa valeur. Ce test exige l'inverse ;
      # l'adopter ferait perdre en silence, à un client qui change de modèle
      # Deepgram, la valeur de 16 champs. Le fichier de test de l'amont n'est
      # pas touché. Toute autre exclusion est interdite : un test rouge se
      # répare ou se tranche, il ne se cache pas.
      - name: Tests d'écran (bloquant)
        # Tourne même si un contrôle précédent a échoué : tous les défauts d'un coup.
        if: ${{ !cancelled() }}
        run: npx vitest run -t '^(?!.*switches to Live under the same provider and saves its relevant settings)'

      # [22/10/2026, lot 1 de cloture-code-avant-migration] Aucune CI ne jouait `npm run build`,
      # alors que l'image de l'écran (`ui/Dockerfile`) le lance : `next build` ajoute au typage
      # la règle d'ordre des imports d'ESLint, BLOQUANTE pour lui. Un défaut qui n'apparaissait
      # qu'à la construction de l'image apparaît maintenant ici. Mêmes variables que le Dockerfile.
      - name: Build de production, comme l'image (bloquant)
        # Tourne même si un contrôle précédent a échoué : tous les défauts d'un coup.
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_NODE_ENV: oss
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Lint (informatif)
        # Tourne même si un contrôle précédent a échoué : tous les défauts d'un coup.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint

  garde-fous:
    name: Réflexes R2 et R3, mise en forme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Sans les sous-modules : le contrôle de Pipecat lit le commit épinglé
      # dans les objets git, jamais l'arbre du sous-module.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Version de ruff tenue ici : celle que résout l'environnement de
      # développement du 25/09 (groupe dev de Pipecat). À relever avec lui.
      - run: pip install ruff==0.16.9

      - name: R3 · aucun nom non défini (bloquant)
        run: ruff check api --select F821

      - name: R2 · Pipecat au même commit dans le sous-module et le Dockerfile (bloquant)
        # Tourne même si un contrôle précédent a échoué : tous les défauts d'un coup.
        if: ${{ !cancelled() }}
        run: node scripts/mark/verifier-pipecat-epingle.mjs

      - name: R5 · chaque dépendance directe de l'image est figée (bloquant)
        if: ${{ !cancelled() }}
        run: node scripts/mark/verifier-contraintes.mjs

      # E4 (25/09) : informative d'abord. Mesure du 25/09 : 81 fichiers seraient
      # reformatés, presque tous à nous. On mesure l'écart avant d'en décider.
      - name: Mise en forme de l'amont (informatif)
        # Tourne même si un contrôle précédent a échoué : tous les défauts d'un coup.
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Les deux mesures s'affichent toujours : la première en échec
        # n'arrête plus la seconde (constaté au premier passage, 25/09).
        run: |
          statut=0
          ruff check api --select I --select F401 --statistics || statut=1
          ruff format --check api || statut=1
          exit $statut

  # [22/10/2026, lot 1] `pre-pr-drift-check.yml` (amont) ne tourne que sur une pull request vers
  # `main`, jamais ouverte chez nous : le client de l'écran (`ui/src/client`) et la spec
  # `docs/api-reference/openapi.json` pouvaient dériver de l'API sans que rien ne le dise. Les
  # lots qui ajoutent des routes (modèles de réglages, conservation, lots F) régénèrent le client ;
  # ici on vérifie qu'ils l'ont fait. ⛔ Le client n'est jamais édité à la main.
  derive-client:
    name: Client de l'écran et spec OpenAPI à jour
    if: ${{ startsWith(github.ref, 'refs/heads/chantier/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost/dummy
      REDIS_URL: redis://localhost:6379/0
      ENABLE_AWS_S3: "false"
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      DEPLOYMENT_MODE: oss
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Create Python virtual environment
        run: |
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install api and pipecat dependencies
        run: ./scripts/setup_requirements.sh

      - name: Install ui dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Dump OpenAPI spec
        run: python -u -m scripts.dump_docs_openapi

      - name: Spec OpenAPI de la documentation à jour (bloquant)
        run: |
          if ! git diff --exit-code docs/api-reference/openapi.json; then
            echo "::error::docs/api-reference/openapi.json n'est pas à jour avec l'API. Lancer 'python -m scripts.dump_docs_openapi' (api/.env chargé) et committer le résultat."
            exit 1
          fi
          echo "La spec OpenAPI est à jour."

      # Le client est généré depuis l'API qui tourne (`ui/openapi-ts.config.ts` lit
      # `<BACKEND_URL>/api/v1/openapi.json`). Ici la spec fraîchement écrite est servie à cette
      # adresse par un serveur de fichiers : mêmes octets que ceux de l'API, sans base ni Redis.
      - name: Régénérer le client de l'écran depuis cette spec
        # Tourne même si le contrôle précédent a échoué : tous les défauts d'un coup.
        if: ${{ !cancelled() }}
        working-directory: ui
        run: |
          mkdir -p "$RUNNER_TEMP/spec/api/v1"
          cp ../docs/api-reference/openapi.json "$RUNNER_TEMP/spec/api/v1/openapi.json"
          (cd "$RUNNER_TEMP/spec" && python -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8123/api/v1/openapi.json -o /dev/null && break
            sleep 1
          done
          BACKEND_URL=http://127.0.0.1:8123 npm run generate-client

      - name: Client de l'écran à jour (bloquant)
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --exit-code -- ui/src/client; then
            echo "::error::ui/src/client n'est pas à jour avec l'API. Lancer 'npm run generate-client' dans ui/ (API en marche) et committer le résultat. Jamais d'édition à la main."
            exit 1
          fi
          echo "Le client de l'écran est à jour."
